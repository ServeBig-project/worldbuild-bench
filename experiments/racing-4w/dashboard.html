<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Worldbuild · parallel games</title>
<style>
:root{color-scheme:dark;--bg:#10131a;--panel:#191e28;--line:#30394a;--dim:#a7b0c2;--accent:#f2b35c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#ecf0f7;font:14px/1.5 system-ui,sans-serif}header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;flex-wrap:wrap}h1{font-size:20px;margin:0}h2{font-size:18px;margin:0}button,select{font:inherit;background:var(--panel);color:inherit;border:1px solid var(--line);border-radius:6px;padding:5px 10px}button{cursor:pointer}.muted{color:var(--dim);font-size:12px}.summary{margin:20px 24px;padding:16px;background:var(--panel);border-radius:10px}.kpis{display:flex;gap:30px;flex-wrap:wrap}.kpis strong{display:block;font-size:24px}.kpis span{color:var(--dim)}#chart{width:100%;height:100px;margin-top:12px}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin:20px 24px}.panel{background:var(--panel);padding:16px;border-radius:10px;min-width:0}.task-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.preview{margin-top:14px;position:relative;aspect-ratio:16/9;background:#111824;border:1px solid var(--line);border-radius:7px;overflow:hidden}.preview .preparing{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim)}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#111824}.candidate{opacity:0;pointer-events:none}.preview-status{min-height:24px;color:var(--accent);font-size:12px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.card{padding:10px;border:1px solid var(--line);border-radius:6px;overflow-wrap:anywhere}.card b{font-size:13px}.status{color:var(--accent);font-size:12px}.feed{height:220px;overflow:auto;font-size:12px;margin-top:12px}.feed div{padding:5px 0;border-bottom:1px solid var(--line)}.error{color:#ff8585}[hidden]{display:none!important}@media(max-width:1000px){main{grid-template-columns:1fr}}@media(max-width:500px){.cards{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Worldbuild · parallel games</h1><select id="engine" aria-label="Engine"></select><span id="hardware" class="muted"></span><span id="connection" class="muted"></span></header>
<section class="summary"><div class="kpis"><div><strong id="active">0</strong><span>active requests</span></div><div><strong id="tokens">0</strong><span>output tokens · reported usage</span></div><div><strong id="speed">0</strong><span>estimated streaming tok/s · characters ÷ 4</span></div><div><strong id="elapsed">—</strong><span id="elapsed-label">time until all tasks finish</span></div></div><canvas id="chart" width="1000" height="100"></canvas><div class="muted">Concurrent requests: amber generating, red waiting for first token. Chart samples while this engine is selected.</div></section>
<main id="tasks"></main>
<script>
const $=id=>document.getElementById(id), panels=new Map();
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const duration=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+'m '+s%60+'s'};
let engine='',polling=false;
function createPanel(run){
 const el=document.createElement('section');el.className='panel';el.dataset.runId=run.id;
 el.innerHTML='<div class="task-head"><h2></h2><button>Retry preview</button></div><div class="phase muted"></div><div class="preview"><div class="preparing">Preparing the first visible game…</div></div><div class="preview-status">Waiting for a rendered game and telemetry.</div><div class="totals muted"></div><div class="changes muted"></div><div class="cards"></div><div class="feed"></div>';
 $('tasks').append(el);
 const panel={el,run,seen:null,attempted:null,current:null,candidate:null,timer:null};
 el.querySelector('button').onclick=()=>loadPreview(panel,true);
 panels.set(run.id,panel);return panel;
}
function previewStatus(panel,text){panel.el.querySelector('.preview-status').textContent=text}
function rejectPreview(panel,detail){
 clearTimeout(panel.timer);panel.candidate?.remove();panel.candidate=null;
 previewStatus(panel,(panel.current?'Keeping last healthy preview. ':'Preparing first preview. ')+detail);
}
function loadPreview(panel,force=false){
 if(!panel.run.game.version||panel.candidate||(!force&&panel.attempted===panel.run.game.version))return;
 panel.attempted=panel.run.game.version;
 const frame=document.createElement('iframe');frame.className='candidate';frame.title=panel.run.task+' candidate preview';
 panel.candidate=frame;frame.src=panel.run.game.url+'?v='+encodeURIComponent(panel.attempted);
 panel.el.querySelector('.preview').append(frame);
 previewStatus(panel,panel.current?'Checking updated game; previous preview remains playable.':'Preparing first preview; checking rendering and telemetry…');
 panel.timer=setTimeout(()=>rejectPreview(panel,'Updated game is not ready; retry after repairs.'),20000);
}
addEventListener('message',event=>{
 if(event.origin!==location.origin||event.data?.type!=='worldbuild-preview')return;
 for(const panel of panels.values()){
  if(event.source===panel.candidate?.contentWindow){
   if(event.data.status==='error'){rejectPreview(panel,String(event.data.detail));return}
   if(event.data.status==='ready'){
    clearTimeout(panel.timer);panel.current?.remove();panel.current=panel.candidate;panel.candidate=null;
    panel.current.classList.remove('candidate');panel.current.title=panel.run.task+' live game';
    panel.el.querySelector('.preparing').hidden=true;
    previewStatus(panel,'Live preview · rendering and telemetry ready. Gameplay is checked by the agents.');return;
   }
  }else if(event.source===panel.current?.contentWindow&&event.data.status==='error'){
   previewStatus(panel,'Current preview reported an error: '+String(event.data.detail));
  }
 }
});
function renderPanel(run,now){
 const panel=panels.get(run.id)??createPanel(run);panel.run=run;panel.el.hidden=false;
 const find=s=>panel.el.querySelector(s);
 find('h2').textContent=run.task;
 find('.phase').textContent=run.phase+' · '+run.id;
 find('.totals').textContent=run.outputTokens.toLocaleString()+' output tokens · '+duration(run.elapsedMs)+' · '+(run.live.running+run.live.queue)+' active requests';
 find('.changes').textContent=run.game.recent.map(f=>f.file).join(' · ');
 find('.cards').innerHTML=[run.root,...run.builders].filter(Boolean).map(a=>'<div class="card"><b>'+escapeHtml(a.agent)+(a.depth===0?' · root':' · depth '+a.depth)+'</b><div class="status">'+escapeHtml(a.status)+'</div><div class="muted">turn '+a.turns+' · '+a.out.toLocaleString()+' output tokens</div><div class="muted">'+escapeHtml(a.tool)+'</div></div>').join('')||'<div class="muted">Agents have not started.</div>';
 find('.feed').innerHTML=run.feed.map(f=>'<div><span class="muted">'+new Date(f.ts).toLocaleTimeString()+' '+escapeHtml(f.agent)+'</span> '+escapeHtml(f.text)+'</div>').join('');
 if(panel.seen===run.game.version)loadPreview(panel);else panel.seen=run.game.version;
}
function chart(series){
 const c=$('chart'),ctx=c.getContext('2d'),W=c.width,H=c.height;ctx.clearRect(0,0,W,H);
 const max=Math.max(1,...series.map(p=>p.running+p.queue)),bw=W/Math.max(60,series.length);
 ctx.fillStyle='#a7b0c2';ctx.fillText('max '+max+' requests',4,12);
 series.forEach((p,i)=>{const h=p.running*(H-20)/max,q=p.queue*(H-20)/max;ctx.fillStyle='#f2b35c';ctx.fillRect(i*bw,H-h,Math.max(1,bw-1),h);ctx.fillStyle='#ff8585';ctx.fillRect(i*bw,H-h-q,Math.max(1,bw-1),q)});
}
async function tick(){
 if(polling)return;polling=true;
 try{
  const requested=engine,response=await fetch('/api/state'+(engine?'?engine='+encodeURIComponent(engine):''),{cache:'no-store'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const state=await response.json();if(requested!==engine)return;
  if(!engine){engine=state.engine;$('engine').innerHTML=state.engines.map(e=>'<option>'+escapeHtml(e)+'</option>').join('');$('engine').value=engine}
  $('hardware').textContent=state.hardware;$('connection').textContent='Live';
  for(const panel of panels.values())panel.el.hidden=true;
  state.runs.forEach(run=>renderPanel(run,state.now));
  const a=state.aggregate;$('active').textContent=a.activeRequests;$('tokens').textContent=a.outputTokens.toLocaleString();$('speed').textContent=a.estimatedTps.toFixed(0);$('elapsed').textContent=duration(a.elapsedMs);$('elapsed-label').textContent=a.completed?'all tasks ended · elapsed frozen':'elapsed · waiting for all tasks';chart(state.batch.series);
 }catch(error){$('connection').textContent='Dashboard unavailable; retrying.'}finally{polling=false}
}
$('engine').onchange=()=>{engine=$('engine').value;tick()};tick();setInterval(tick,2000);
</script></body></html>
