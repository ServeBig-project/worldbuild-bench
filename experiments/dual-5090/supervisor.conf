[program:worldbuild-dashboard]
command=/bin/bash /opt/worldbuild/start-dashboard.sh
autostart=true
autorestart=unexpected
stopasgroup=true
killasgroup=true
stdout_logfile=/opt/worldbuild/logs/dashboard.log
redirect_stderr=true

[program:worldbuild-br]
command=/bin/bash /opt/worldbuild/start-br.sh
autostart=false
autorestart=false
stopasgroup=true
killasgroup=true
stopwaitsecs=60
stdout_logfile=/opt/worldbuild/logs/br.log
redirect_stderr=true

[program:worldbuild-strata]
command=/bin/bash /opt/worldbuild/start-strata.sh
autostart=false
autorestart=false
stopasgroup=true
killasgroup=true
stopwaitsecs=60
stdout_logfile=/opt/worldbuild/logs/strata-server.log
redirect_stderr=true

[program:worldbuild-bench-br]
command=/bin/bash /opt/worldbuild/start-benchmark.sh paper2
autostart=false
autorestart=false
stopasgroup=true
killasgroup=true
stopwaitsecs=60
stdout_logfile=/opt/worldbuild/logs/bench-br.log
redirect_stderr=true

[program:worldbuild-bench-strata]
command=/bin/bash /opt/worldbuild/start-benchmark.sh strata
autostart=false
autorestart=false
stopasgroup=true
killasgroup=true
stopwaitsecs=60
stdout_logfile=/opt/worldbuild/logs/bench-strata.log
redirect_stderr=true
